    <circle class="rank-circle" cx="0" cy="0" r="46" />
    <text x="0" y="2" alignment-baseline="central" dominant-baseline="central" text-anchor="middle" class="rank-text" data-testid="level-rank-icon">C</text>
    <text x="0" y="68" text-anchor="middle" class="rank-label">OVERALL RANK</text>

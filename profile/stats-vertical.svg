<svg
  width="100%"
  height="auto"
  viewBox="0 0 400 450"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId_v"
>
  <title id="titleId_v">Abdoslam Baabbad's GitHub Stats, Rank: C</title>
  <desc id="descId_v">Total Stars Earned: 1, Total Commits: 444, Total PRs: 3, Total Issues: 1, Contributed to (last year): 1</desc>
  <style>
    .header {
      font: 700 21px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #2f97c1;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .stat {
      font: 700 17px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #0cf574;
    }
    .stat-val {
      font: 800 18px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #0cf574;
      text-anchor: end;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.5s ease-out forwards;
    }
    .rank-circle-anim {
      opacity: 0;
      animation: fadeInAnimation 0.6s ease-out 350ms forwards;
    }
    .rank-text {
      font: 800 34px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #0cf574;
    }
    .rank-label {
      font: 700 13px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #2f97c1;
      letter-spacing: 1.5px;
      opacity: 0.9;
    }
    .icon {
      fill: #f5b700;
      display: block;
    }
    .rank-circle-rim {
      stroke: #2f97c1;
      fill: none;
      stroke-width: 6;
      opacity: 0.2;
    }
    .rank-circle {
      stroke: #2f97c1;
      stroke-dasharray: 289;
      stroke-dashoffset: 268;
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      opacity: 0.9;
      transform-origin: 200px 325px;
      transform: rotate(-90deg);
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>


<svg
  width="100%"
  height="327"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">Abdoslam Baabbad's Most Used Languages</desc>
  <style>
    .header {
      font: 700 20px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #2f97c1;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 18px; }
    }
    .lang-name {
      font: 600 14px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #0cf574;
    }
    .lang-pct {
      font: 600 14px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #0cf574;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.5s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="326"
    stroke="#e4e2e2"
    width="calc(100% - 1px)"
    fill="#00000000"
    stroke-opacity="1"
  />

  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
  </g>

  <g data-testid="main-card-body">
  <g transform="translate(25, 55)">
    <g class="stagger" style="animation-delay: 450ms">
      <text data-testid="lang-name" x="0" y="14" class="lang-name">Python</text>
      <svg x="0" y="22" width="calc(100% - 120px)" height="11" overflow="hidden">
        <rect data-testid="progress-background" rx="5.5" ry="5.5" x="0" y="0" width="100%" height="11" fill="#ddd" fill-opacity="0.3"/>
        <rect width="38.93%" height="11" fill="#3572A5" rx="5.5" ry="5.5" x="0" y="0" class="lang-progress"/>
      </svg>
      <svg x="calc(100% - 110px)" y="22" width="60" height="15" overflow="visible">
        <text x="0" y="10" class="lang-pct">38.93%</text>
      </svg>
    </g>
  </g>
  <g transform="translate(25, 97)">
    <g class="stagger" style="animation-delay: 600ms">
      <text data-testid="lang-name" x="0" y="14" class="lang-name">JavaScript</text>
      <svg x="0" y="22" width="calc(100% - 120px)" height="11" overflow="hidden">
        <rect data-testid="progress-background" rx="5.5" ry="5.5" x="0" y="0" width="100%" height="11" fill="#ddd" fill-opacity="0.3"/>
        <rect width="24.69%" height="11" fill="#f1e05a" rx="5.5" ry="5.5" x="0" y="0" class="lang-progress"/>
      </svg>
      <svg x="calc(100% - 110px)" y="22" width="60" height="15" overflow="visible">
        <text x="0" y="10" class="lang-pct">24.69%</text>
      </svg>
    </g>
  </g>
  <g transform="translate(25, 139)">
    <g class="stagger" style="animation-delay: 750ms">
      <text data-testid="lang-name" x="0" y="14" class="lang-name">R</text>
      <svg x="0" y="22" width="calc(100% - 120px)" height="11" overflow="hidden">
        <rect data-testid="progress-background" rx="5.5" ry="5.5" x="0" y="0" width="100%" height="11" fill="#ddd" fill-opacity="0.3"/>
        <rect width="15.08%" height="11" fill="#198CE7" rx="5.5" ry="5.5" x="0" y="0" class="lang-progress"/>
      </svg>
      <svg x="calc(100% - 110px)" y="22" width="60" height="15" overflow="visible">
        <text x="0" y="10" class="lang-pct">15.08%</text>
      </svg>
    </g>
  </g>
  <g transform="translate(25, 181)">
    <g class="stagger" style="animation-delay: 900ms">
      <text data-testid="lang-name" x="0" y="14" class="lang-name">CoffeeScript</text>
      <svg x="0" y="22" width="calc(100% - 120px)" height="11" overflow="hidden">
        <rect data-testid="progress-background" rx="5.5" ry="5.5" x="0" y="0" width="100%" height="11" fill="#ddd" fill-opacity="0.3"/>
        <rect width="10.58%" height="11" fill="#244776" rx="5.5" ry="5.5" x="0" y="0" class="lang-progress"/>
      </svg>
      <svg x="calc(100% - 110px)" y="22" width="60" height="15" overflow="visible">
        <text x="0" y="10" class="lang-pct">10.58%</text>
      </svg>
    </g>
  </g>
  <g transform="translate(25, 223)">
    <g class="stagger" style="animation-delay: 1050ms">
      <text data-testid="lang-name" x="0" y="14" class="lang-name">TSQL</text>
      <svg x="0" y="22" width="calc(100% - 120px)" height="11" overflow="hidden">
        <rect data-testid="progress-background" rx="5.5" ry="5.5" x="0" y="0" width="100%" height="11" fill="#ddd" fill-opacity="0.3"/>
        <rect width="5.67%" height="11" fill="#e38c00" rx="5.5" ry="5.5" x="0" y="0" class="lang-progress"/>
      </svg>
      <svg x="calc(100% - 110px)" y="22" width="60" height="15" overflow="visible">
        <text x="0" y="10" class="lang-pct">5.67%</text>
      </svg>
    </g>
  </g>
  <g transform="translate(25, 265)">
    <g class="stagger" style="animation-delay: 1200ms">
      <text data-testid="lang-name" x="0" y="14" class="lang-name">HTML</text>
      <svg x="0" y="22" width="calc(100% - 120px)" height="11" overflow="hidden">
        <rect data-testid="progress-background" rx="5.5" ry="5.5" x="0" y="0" width="100%" height="11" fill="#ddd" fill-opacity="0.3"/>
        <rect width="5.05%" height="11" fill="#e34c26" rx="5.5" ry="5.5" x="0" y="0" class="lang-progress"/>
      </svg>
      <svg x="calc(100% - 110px)" y="22" width="60" height="15" overflow="visible">
        <text x="0" y="10" class="lang-pct">5.05%</text>
      </svg>
    </g>
  </g>
  </g>
</svg>
name: Update README stat cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=AbdoslamB&show_icons=true&include_all_commits=true&count_private=true&theme=blue-green&bg_color=00000000"
          path: profile/stats.svg
          token: ${{ secrets.STREAK_TOKEN }}

      - name: Format stats cards (desktop horizontal & mobile vertical)
        run: |
          python3 -c '
          import re
          path_h = "profile/stats.svg"
          path_v = "profile/stats-vertical.svg"
          try:
              with open(path_h, "r", encoding="utf-8") as f:
                  s = f.read()

              stars = re.search(r"data-testid=[\x27\"]stars[\x27\"][^>]*>([^<]+)<", s)
              commits = re.search(r"data-testid=[\x27\"]commits[\x27\"][^>]*>([^<]+)<", s)
              prs = re.search(r"data-testid=[\x27\"]prs[\x27\"][^>]*>([^<]+)<", s)
              issues = re.search(r"data-testid=[\x27\"]issues[\x27\"][^>]*>([^<]+)<", s)
              contribs = re.search(r"data-testid=[\x27\"]contribs[\x27\"][^>]*>([^<]+)<", s)
              rank = re.search(r"data-testid=[\x27\"]level-rank-icon[\x27\"][^>]*>([^<]+)<", s)
              header = re.search(r"data-testid=[\x27\"]header[\x27\"][^>]*>([^<]+)<", s)

              stars_v = stars.group(1).strip() if stars else "1"
              commits_v = commits.group(1).strip() if commits else "0"
              prs_v = prs.group(1).strip() if prs else "0"
              issues_v = issues.group(1).strip() if issues else "0"
              contribs_v = contribs.group(1).strip() if contribs else "0"
              rank_v = rank.group(1).strip() if rank else "C"
              header_v = header.group(1).strip() if header else "Abdoslam Baabbad\x27s GitHub Stats"

              # Format horizontal card (laptop view: stats left, rank right)
              s = re.sub(r"width=\"\d+\"", "width=\"495\"", s, count=1)
              s = re.sub(r"viewBox=\"0 0 \d+ \d+\"", "viewBox=\"0 0 495 195\"", s)
              s = re.sub(r"font:\s*600\s*18px\s*\x27Segoe UI\x27", "font: 700 20px \x27Segoe UI\x27", s)
              s = re.sub(r"\.stat\s*\{\s*font:\s*600\s*14px[^\}]*\}", ".stat { font: 700 15px \x27Segoe UI\x27, Ubuntu, Sans-Serif; fill: #0cf574; }", s)
              with open(path_h, "w", encoding="utf-8") as f:
                  f.write(s)

              # Format vertical card (mobile view: stats above rank grade C with big fonts)
              vert_stats = f"""<svg
  width="100%"
  height="auto"
  viewBox="0 0 400 450"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId_v"
>
  <title id="titleId_v">{header_v}, Rank: {rank_v}</title>
  <desc id="descId_v">Total Stars Earned: {stars_v}, Total Commits: {commits_v}, Total PRs: {prs_v}, Total Issues: {issues_v}, Contributed to (last year): {contribs_v}</desc>
  <style>
    .header {{
      font: 700 21px \x27Segoe UI\x27, Ubuntu, Sans-Serif;
      fill: #2f97c1;
    }}
    .stat {{
      font: 700 17px \x27Segoe UI\x27, Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #0cf574;
    }}
    .stat-val {{
      font: 800 18px \x27Segoe UI\x27, Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #0cf574;
      text-anchor: end;
    }}
    .rank-text {{
      font: 800 34px \x27Segoe UI\x27, Ubuntu, Sans-Serif;
      fill: #0cf574;
    }}
    .rank-label {{
      font: 700 13px \x27Segoe UI\x27, Ubuntu, Sans-Serif;
      fill: #2f97c1;
      letter-spacing: 1.5px;
      opacity: 0.9;
    }}
    .icon {{
      fill: #f5b700;
      display: block;
    }}
    .rank-circle-rim {{
      stroke: #2f97c1;
      fill: none;
      stroke-width: 6;
      opacity: 0.2;
    }}
    .rank-circle {{
      stroke: #2f97c1;
      stroke-dasharray: 289;
      stroke-dashoffset: 268;
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      opacity: 0.9;
      transform-origin: 200px 325px;
      transform: rotate(-90deg);
    }}
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="449"
    stroke="#e4e2e2"
    width="399"
    fill="#00000000"
    stroke-opacity="1"
  />

  <g data-testid="card-title" transform="translate(20, 35)">
    <text x="0" y="0" class="header" data-testid="header">{header_v}</text>
  </g>

  <g data-testid="main-card-body">
    <g transform="translate(20, 58)">
      <svg class="icon" viewBox="0 0 16 16" width="18" height="18" y="2">
        <path fill-rule="evenodd" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25zm0 2.445L6.615 5.5a.75.75 0 01-.564.41l-3.097.45 2.24 2.184a.75.75 0 01.216.664l-.528 3.084 2.769-1.456a.75.75 0 01.698 0l2.77 1.456-.53-3.084a.75.75 0 01.216-.664l2.24-2.183-3.096-.45a.75.75 0 01-.564-.41L8 2.694v.001z"/>
      </svg>
      <text class="stat" x="28" y="16">Total Stars Earned:</text>
      <text class="stat-val" x="360" y="16" data-testid="stars">{stars_v}</text>
    </g>

    <g transform="translate(20, 92)">
      <svg class="icon" viewBox="0 0 16 16" width="18" height="18" y="2">
        <path fill-rule="evenodd" d="M1.643 3.143L.427 1.927A.25.25 0 000 2.104V5.75c0 .138.112.25.25.25h3.646a.25.25 0 00.177-.427L2.715 4.215a6.5 6.5 0 11-1.18 4.458.75.75 0 10-1.493.154 8.001 8.001 0 101.6-5.684zM7.75 4a.75.75 0 01.75.75v2.992l2.028.812a.75.75 0 01-.557 1.392l-2.5-1A.75.75 0 017 8.25v-3.5A.75.75 0 017.75 4z"/>
      </svg>
      <text class="stat" x="28" y="16">Total Commits:</text>
      <text class="stat-val" x="360" y="16" data-testid="commits">{commits_v}</text>
    </g>

    <g transform="translate(20, 126)">
      <svg class="icon" viewBox="0 0 16 16" width="18" height="18" y="2">
        <path fill-rule="evenodd" d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/>
      </svg>
      <text class="stat" x="28" y="16">Total PRs:</text>
      <text class="stat-val" x="360" y="16" data-testid="prs">{prs_v}</text>
    </g>

    <g transform="translate(20, 160)">
      <svg class="icon" viewBox="0 0 16 16" width="18" height="18" y="2">
        <path fill-rule="evenodd" d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8zm9 3a1 1 0 11-2 0 1 1 0 012 0zm-.25-6.25a.75.75 0 00-1.5 0v3.5a.75.75 0 001.5 0v-3.5z"/>
      </svg>
      <text class="stat" x="28" y="16">Total Issues:</text>
      <text class="stat-val" x="360" y="16" data-testid="issues">{issues_v}</text>
    </g>

    <g transform="translate(20, 194)">
      <svg class="icon" viewBox="0 0 16 16" width="18" height="18" y="2">
        <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/>
      </svg>
      <text class="stat" x="28" y="16">Contributed to (last year):</text>
      <text class="stat-val" x="360" y="16" data-testid="contribs">{contribs_v}</text>
    </g>
  </g>

  <line x1="20" y1="235" x2="380" y2="235" stroke="#e4e2e2" stroke-opacity="0.25" stroke-width="1.5"/>

  <g data-testid="rank-circle" transform="translate(200, 320)">
    <circle class="rank-circle-rim" cx="0" cy="0" r="46" />
    <circle class="rank-circle" cx="0" cy="0" r="46" />
    <text x="0" y="2" alignment-baseline="central" dominant-baseline="central" text-anchor="middle" class="rank-text" data-testid="level-rank-icon">{rank_v}</text>
    <text x="0" y="68" text-anchor="middle" class="rank-label">OVERALL RANK</text>
  </g>
</svg>"""
              with open(path_v, "w", encoding="utf-8") as f:
                  f.write(vert_stats)
              print("Formatted stats cards (horizontal and vertical) successfully!")
          except Exception as e:
              print("Stats formatter skipped:", e)
          '

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=AbdoslamB&theme=blue-green&bg_color=00000000&hide_border=true&card_width=495&count_private=true&size_weight=0.5&count_weight=0.5&langs_count=6"
          path: profile/top-langs.svg
          token: ${{ secrets.STREAK_TOKEN }}

      - name: Align top languages card width and mobile boost
        run: |
          python3 -c '
          import re
          path = "profile/top-langs.svg"
          try:
              with open(path, "r", encoding="utf-8") as f:
                  s = f.read()
              s = re.sub(r"width=\"\d+\"", "width=\"495\"", s, count=1)
              s = re.sub(r"viewBox=\"0 0 \d+ \d+\"", "viewBox=\"0 0 495 245\"", s)
              s = re.sub(r"stroke-opacity=\"1\"", "stroke-opacity=\"0\"", s)
              s = re.sub(r"font:\s*600\s*18px\s*\x27Segoe UI\x27", "font: 700 20px \x27Segoe UI\x27", s)
              s = re.sub(r"\.lang-name\s*\{\s*font:\s*400\s*11px[^\}]*\}", ".lang-name { font: 600 14px \"Segoe UI\", Ubuntu, Sans-Serif; fill: #0cf574; }", s)
              s = re.sub(r"width=\"205\"", "width=\"380\"", s)
              s = re.sub(r"height=\"8\"", "height=\"11\"", s)
              s = re.sub(r"x=\"215\"", "x=\"390\"", s)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(s)
              print("Aligned top-langs card successfully!")
          except Exception as e:
              print("Top-langs align skipped:", e)
          '

      - name: Generate streak stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=AbdoslamB&theme=blue-green&background=00000000"
          path: profile/streak.svg
          token: ${{ secrets.STREAK_TOKEN }}

      - name: Smart streak handler (processes desktop card & generates mobile vertical card)
        run: |
          python3 -c '
          import re
          path_h = "profile/streak.svg"
          path_v = "profile/streak-vertical.svg"
          try:
              with open(path_h, "r", encoding="utf-8") as f:
                  s = f.read()

              s = re.sub(r"font-size=[\x27\"]12px[\x27\"]", "font-size=\x2714px\x27", s)
              num_pat = r"(<!-- Current Streak big number -->\s*<g transform=[\x27\"]translate\(247\.5,\s*48\)[\x27\"][^>]*>\s*<text[^>]*>)\s*0\s*(</text>\s*</g>)"
              is_zero_streak = bool(re.search(num_pat, s)) or ("Local Dev" in s and "cursorBlink" in s)

              if re.search(num_pat, s):
                  if "cursorBlink" not in s:
                      kf = "\n            @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }\n            @keyframes devPulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 1; } }\n"
                      s = s.replace("</style>", kf + "\n        </style>")
                  icon = """<!-- Animated Local Dev Terminal Icon -->
                      <g transform=\x27translate(247.5, 68)\x27 style=\x27animation: devPulse 2s ease-in-out infinite\x27>
                          <rect x=\x27-20\x27 y=\x27-15\x27 width=\x2740\x27 height=\x2730\x27 rx=\x274\x27 fill=\x27#0d1117\x27 stroke=\x27#2F97C1\x27 stroke-width=\x271.8\x27/>
                          <line x1=\x27-20\x27 y1=\x27-7\x27 x2=\x2720\x27 y2=\x27-7\x27 stroke=\x27#2F97C1\x27 stroke-width=\x271\x27 opacity=\x270.4\x27/>
                          <circle cx=\x27-14\x27 cy=\x27-11\x27 r=\x271.3\x27 fill=\x27#FF5F56\x27/>
                          <circle cx=\x27-10\x27 cy=\x27-11\x27 r=\x271.3\x27 fill=\x27#FFBD2E\x27/>
                          <circle cx=\x27-6\x27 cy=\x27-11\x27 r=\x271.3\x27 fill=\x27#27C93F\x27/>
                          <path d=\x27M -12 -1 L -7 3 L -12 7\x27 fill=\x27none\x27 stroke=\x27#F5B700\x27 stroke-width=\x271.8\x27 stroke-linecap=\x27round\x27 stroke-linejoin=\x27round\x27/>
                          <line x1=\x27-3\x27 y1=\x277\x27 x2=\x274\x27 y2=\x277\x27 stroke=\x27#0CF574\x27 stroke-width=\x272\x27 stroke-linecap=\x27round\x27 style=\x27animation: cursorBlink 1s step-end infinite\x27/>
                      </g>"""
                  s = re.sub(num_pat, icon, s)
                  s = re.sub(r"(<!-- Current Streak label -->\s*<g transform=[\x27\"]translate\(247\.5,\s*108\)[\x27\"][^>]*>\s*<text[^>]*>)\s*Current Streak\s*(</text>)", r"\g<1>Local Dev\g<2>", s)
                  s = re.sub(r"(<!-- Current Streak range -->\s*<g transform=[\x27\"]translate\(247\.5,\s*145\)[\x27\"][^>]*>\s*<text[^>]*>)\s*[^<]*\s*(</text>)", r"\g<1>Working Offline\g<2>", s)

              with open(path_h, "w", encoding="utf-8") as f:
                  f.write(s)

              tot_m = re.search(r"<!-- Total Contributions big number -->.*?<text[^>]*>\s*([^<]+)\s*</text>", s, re.DOTALL)
              tot_num = tot_m.group(1).strip() if tot_m else "421"
              tot_r_m = re.search(r"<!-- Total Contributions range -->.*?<text[^>]*>\s*([^<]+)\s*</text>", s, re.DOTALL)
              tot_range = tot_r_m.group(1).strip() if tot_r_m else "Oct 5, 2018 - Present"

              long_m = re.search(r"<!-- Longest Streak big number -->.*?<text[^>]*>\s*([^<]+)\s*</text>", s, re.DOTALL)
              long_num = long_m.group(1).strip() if long_m else "5"
              long_r_m = re.search(r"<!-- Longest Streak range -->.*?<text[^>]*>\s*([^<]+)\s*</text>", s, re.DOTALL)
              long_range = long_r_m.group(1).strip() if long_r_m else "Dec 11, 2021 - Dec 15, 2021"

              if is_zero_streak:
                  curr_section = """<!-- Animated Local Dev Terminal Icon -->
                  <g transform=\x27translate(195, 235)\x27 style=\x27animation: devPulse 2s ease-in-out infinite\x27>
                      <rect x=\x27-32\x27 y=\x27-23\x27 width=\x2764\x27 height=\x2746\x27 rx=\x276\x27 fill=\x27#0d1117\x27 stroke=\x27#2F97C1\x27 stroke-width=\x272.2\x27/>
                      <line x1=\x27-32\x27 y1=\x27-11\x27 x2=\x2732\x27 y2=\x27-11\x27 stroke=\x27#2F97C1\x27 stroke-width=\x271.4\x27 opacity=\x270.4\x27/>
                      <circle cx=\x27-22\x27 cy=\x27-17\x27 r=\x272\x27 fill=\x27#FF5F56\x27/>
                      <circle cx=\x27-16\x27 cy=\x27-17\x27 r=\x272\x27 fill=\x27#FFBD2E\x27/>
                      <circle cx=\x27-10\x27 cy=\x27-17\x27 r=\x272\x27 fill=\x27#27C93F\x27/>
                      <path d=\x27M -18 -2 L -10 5 L -18 12\x27 fill=\x27none\x27 stroke=\x27#F5B700\x27 stroke-width=\x272.4\x27 stroke-linecap=\x27round\x27 stroke-linejoin=\x27round\x27/>
                      <line x1=\x27-5\x27 y1=\x2712\x27 x2=\x277\x27 y2=\x2712\x27 stroke=\x27#0CF574\x27 stroke-width=\x272.8\x27 stroke-linecap=\x27round\x27 style=\x27animation: cursorBlink 1s step-end infinite\x27/>
                  </g>
                  <g transform=\x27translate(195, 288)\x27>
                      <text x=\x270\x27 y=\x2724\x27 stroke-width=\x270\x27 text-anchor=\x27middle\x27 fill=\x27#F5B700\x27 stroke=\x27none\x27 font-family=\x27"Segoe UI", Ubuntu, sans-serif\x27 font-weight=\x27700\x27 font-size=\x2718px\x27 font-style=\x27normal\x27>
                          Local Dev
                      </text>
                  </g>
                  <g transform=\x27translate(195, 320)\x27>
                      <text x=\x270\x27 y=\x2722\x27 stroke-width=\x270\x27 text-anchor=\x27middle\x27 fill=\x27#0CF574\x27 stroke=\x27none\x27 font-family=\x27"Segoe UI", Ubuntu, sans-serif\x27 font-weight=\x27500\x27 font-size=\x2716px\x27 font-style=\x27normal\x27>
                          Working Offline
                      </text>
                  </g>"""
              else:
                  curr_num_m = re.search(r"<!-- Current Streak big number -->.*?<text[^>]*>\s*([^<]+)\s*</text>", s, re.DOTALL)
                  curr_num = curr_num_m.group(1).strip() if curr_num_m else "3"
                  curr_r_m = re.search(r"<!-- Current Streak range -->.*?<text[^>]*>\s*([^<]+)\s*</text>", s, re.DOTALL)
                  curr_range = curr_r_m.group(1).strip() if curr_r_m else "Sep 5 - Sep 7"
                  curr_section = f"""<!-- Ring around number -->
                  <g mask=\x27url(#mask_out_ring_behind_fire_v)\x27>
                      <circle cx=\x27195\x27 cy=\x27235\x27 r=\x2746\x27 fill=\x27none\x27 stroke=\x27#2F97C1\x27 stroke-width=\x276\x27></circle>
                  </g>
                  <!-- Fire icon -->
                  <g transform=\x27translate(195, 172)\x27 stroke-opacity=\x270\x27>
                      <path d=\x27M -14 -0.5 L 17 -0.5 L 17 27 L -14 27 L -14 -0.5 Z\x27 fill=\x27none\x27/>
                      <path d=\x27M 1.7 0.8 C 1.7 0.8 2.5 3.8 2.5 6.2 C 2.5 8.6 1.0 10.5 -1.3 10.5 C -3.6 10.5 -5.4 8.6 -5.4 6.2 L -5.3 5.8 C -7.6 8.5 -9.0 12.0 -9.0 15.9 C -9.0 20.9 -4.9 25.0 0 25.0 C 4.9 25.0 9.0 20.9 9.0 15.9 C 9.0 9.8 6.1 4.3 1.7 0.8 Z M -0.3 21.5 C -2.3 21.5 -4.0 20.0 -4.0 18.0 C -4.0 16.1 -2.8 14.8 -0.8 14.4 C 1.2 14.0 3.3 13.0 4.4 11.5 C 4.9 13.0 5.1 14.5 5.1 16.1 C 5.1 19.1 2.7 21.5 -0.3 21.5 Z\x27 fill=\x27#2F97C1\x27 stroke-opacity=\x270\x27/>
                  </g>
                  <!-- Current Streak big number -->
                  <g transform=\x27translate(195, 212)\x27>
                      <text x=\x270\x27 y=\x2742\x27 stroke-width=\x270\x27 text-anchor=\x27middle\x27 fill=\x27#F5B700\x27 stroke=\x27none\x27 font-family=\x27"Segoe UI", Ubuntu, sans-serif\x27 font-weight=\x27800\x27 font-size=\x2748px\x27 font-style=\x27normal\x27 style=\x27animation: currstreak 0.6s linear forwards\x27>
                          {curr_num}
                      </text>
                  </g>
                  <!-- Current Streak label -->
                  <g transform=\x27translate(195, 288)\x27>
                      <text x=\x270\x27 y=\x2724\x27 stroke-width=\x270\x27 text-anchor=\x27middle\x27 fill=\x27#F5B700\x27 stroke=\x27none\x27 font-family=\x27"Segoe UI", Ubuntu, sans-serif\x27 font-weight=\x27700\x27 font-size=\x2718px\x27 font-style=\x27normal\x27>
                          Current Streak
                      </text>
                  </g>
                  <!-- Current Streak range -->
                  <g transform=\x27translate(195, 320)\x27>
                      <text x=\x270\x27 y=\x2722\x27 stroke-width=\x270\x27 text-anchor=\x27middle\x27 fill=\x27#0CF574\x27 stroke=\x27none\x27 font-family=\x27"Segoe UI", Ubuntu, sans-serif\x27 font-weight=\x27500\x27 font-size=\x2716px\x27 font-style=\x27normal\x27>
                          {curr_range}
                      </text>
                  </g>"""

              vert_svg = f"""<svg xmlns=\x27http://www.w3.org/2000/svg\x27 xmlns:xlink=\x27http://www.w3.org/1999/xlink\x27
     style=\x27isolation: isolate\x27 viewBox=\x270 0 390 540\x27 width=\x27100%\x27 height=\x27auto\x27 direction=\x27ltr\x27>
    <style>
        @keyframes currstreak {{
            0% {{ font-size: 8px; opacity: 0.2; }}
            80% {{ font-size: 52px; opacity: 1; }}
            100% {{ font-size: 48px; opacity: 1; }}
        }}
        @keyframes cursorBlink {{ 0%, 49% {{ opacity: 1; }} 50%, 100% {{ opacity: 0; }} }}
        @keyframes devPulse {{ 0%, 100% {{ opacity: 0.95; }} 50% {{ opacity: 1; }} }}
    </style>
    <defs>
        <clipPath id=\x27outer_rectangle_v\x27>

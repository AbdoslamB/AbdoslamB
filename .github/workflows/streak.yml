name: Update README stat cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=AbdoslamB&show_icons=true&theme=blue-green&bg_color=00000000"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=AbdoslamB&theme=blue-green&bg_color=00000000&hide_border=true&hide=javascript,html,coffeescript&count_private=true"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate streak stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=AbdoslamB&theme=blue-green&background=00000000&hide_border=true"
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update stat cards" || echo "no changes"
          git push
